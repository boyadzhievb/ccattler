---
- name: Clean up old state (skip with --skip-tags cleanup)
  hosts: all
  become: true
  tags: [cleanup]
  roles:
    - cleanup

- name: Common setup on all nodes
  hosts: all
  become: true
  roles:
    - common

- name: Provision control-plane node
  hosts: controlplane
  become: true
  roles:
    - controlplane

- name: Provision worker nodes
  hosts: workers
  become: true
  roles:
    - worker

- name: Deploy test application
  hosts: controlplane
  become: true
  roles:
    - testapp
