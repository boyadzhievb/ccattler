# Two-node CCattler cluster:
#   cca-node-1 (192.168.100.43):  etcd + control plane + worker
#   cca-node-2 (192.168.100.215): worker only

[etcd]
cca-node-1 ansible_host=192.168.100.43 ansible_user=bojan ansible_ssh_private_key_file=~/.ssh/id_rsa_lenovo_bojan

[controlplane]
cca-node-1

[workers]
cca-node-1 node_id=node-1
cca-node-2 ansible_host=192.168.100.215 ansible_user=bozhan node_id=node-2 ansible_ssh_private_key_file=~/.ssh/id_rsa_dell_bozhan

[ccattler:children]
controlplane
workers

[all:vars]
ansible_ssh_common_args=-o StrictHostKeyChecking=no
