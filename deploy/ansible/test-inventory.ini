# Test cluster on libvirt VMs (192.168.122.x)
#   cca-test-ctrl       (122.10): etcd + control plane + worker
#   cca-test-worker-1   (122.20): worker only
#   cca-test-worker-2   (122.30): worker only

[etcd]
cca-test-ctrl ansible_host=192.168.122.10 ansible_ssh_private_key_file=.vagrant/machines/cca-test-ctrl/libvirt/private_key

[controlplane]
cca-test-ctrl

[workers]
cca-test-ctrl node_id=test-node-1
cca-test-worker-1 ansible_host=192.168.122.20 node_id=test-node-2 ansible_ssh_private_key_file=.vagrant/machines/cca-test-worker-1/libvirt/private_key
cca-test-worker-2 ansible_host=192.168.122.30 node_id=test-node-3 ansible_ssh_private_key_file=.vagrant/machines/cca-test-worker-2/libvirt/private_key

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=vagrant
ansible_ssh_common_args=-o StrictHostKeyChecking=no
etcd_endpoints=http://192.168.122.10:2379
