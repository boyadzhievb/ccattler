# Ephemeral e2e test cluster on libvirt VMs (192.168.122.x)
#   cca-test-ctrl       (122.10): etcd + control plane + worker
#   cca-test-worker-1   (122.20): worker
#   cca-test-worker-2   (122.30): worker

[etcd]
cca-test-ctrl ansible_host=192.168.122.10 ansible_ssh_private_key_file=../../test/e2e/vm-test/.vmherd/id_ed25519

[controlplane]
cca-test-ctrl

[workers]
cca-test-ctrl
cca-test-worker-1 ansible_host=192.168.122.20 ansible_ssh_private_key_file=../../test/e2e/vm-test/.vmherd/id_ed25519
cca-test-worker-2 ansible_host=192.168.122.30 ansible_ssh_private_key_file=../../test/e2e/vm-test/.vmherd/id_ed25519

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=vmherd
ansible_ssh_common_args=-o StrictHostKeyChecking=no
etcd_endpoints=https://192.168.122.10:2379
