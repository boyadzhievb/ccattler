# Bare-metal 3-node cluster (no VMs)
#   node-1 (100.215): etcd + control plane + worker
#   node-2 (100.24):  worker
#   node-3 (100.29):  worker

[etcd]
node-1 ansible_host=192.168.100.215

[controlplane]
node-1

[workers]
node-1
node-2 ansible_host=192.168.100.30
node-3 ansible_host=192.168.100.31

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=bozhan
ansible_ssh_private_key_file=~/.ssh/id_rsa_dell_bozhan
ansible_ssh_common_args=-o StrictHostKeyChecking=no
etcd_endpoints=https://192.168.100.215:2379
dataplane_backend=ebpf
