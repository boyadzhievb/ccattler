---
# Long-lived deploy cluster: create libvirt VMs, deploy CCattler, deploy Airflow
#
# Uses deploy-Vagrantfile (192.168.124.x) — separate from test-Vagrantfile so
# the e2e test cluster (192.168.122.x) and deploy cluster can coexist.
#
# Run on 192.168.100.43:
#   cd /path/to/ccattler/deploy/ansible
#   ansible-playbook -i deploy-inventory.ini deploy-deploy.yml
#
# After deployment, access Airflow web UI at https://<worker-ip>:443
# Default credentials: airflow / airflow

- name: Create deploy VMs with vagrant
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [vagrant]
  tasks:
    - name: Start VMs (no provisioning)
      shell: VAGRANT_VAGRANTFILE=deploy-Vagrantfile vagrant up --no-provision
      args:
        chdir: "{{ playbook_dir }}"

    - name: Wait for VMs to accept SSH
      wait_for:
        host: "{{ item }}"
        port: 22
        timeout: 180
      loop:
        - 192.168.124.10
        - 192.168.124.20
        - 192.168.124.30

- name: Clean up old state (skip with --skip-tags cleanup)
  hosts: all
  become: true
  tags: [cleanup]
  roles:
    - cleanup

- name: Common setup on all nodes
  hosts: all
  become: true
  roles:
    - common

- name: Provision control-plane node
  hosts: controlplane
  become: true
  roles:
    - controlplane

- name: Provision worker nodes
  hosts: workers
  become: true
  roles:
    - worker

- name: Generate Airflow self-signed TLS certificate
  hosts: controlplane
  become: true
  tags: [testapp]
  tasks:
    - name: Create Airflow cert directory
      file:
        path: /tmp/airflow-certs
        state: directory
        mode: "0755"

    - name: Generate self-signed certificate for Airflow webserver
      shell: >
        openssl req -x509 -newkey rsa:2048 -nodes
        -keyout /tmp/airflow-certs/tls.key
        -out /tmp/airflow-certs/tls.crt
        -days 365
        -subj "/CN=airflow.home.arpa/O=CCattler"
      args:
        creates: /tmp/airflow-certs/tls.crt

    - name: Generate Fernet key for Airflow
      shell: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > /tmp/airflow-certs/fernet-key
      args:
        creates: /tmp/airflow-certs/fernet-key
      ignore_errors: true

    - name: Fallback Fernet key if python3-cryptography is not installed
      shell: openssl rand -base64 32 > /tmp/airflow-certs/fernet-key
      args:
        creates: /tmp/airflow-certs/fernet-key

- name: Deploy Airflow application
  hosts: controlplane
  become: false
  tags: [testapp]
  tasks:
    - name: Copy Airflow deployment config to control plane
      become: true
      copy:
        src: "{{ playbook_dir }}/airflow-test-app.cca"
        dest: /tmp/airflow-test-app.cca
        mode: "0644"

    - name: Wait for CCattler server to be ready
      become: true
      shell: >
        curl -sf --cacert {{ cca_cert_dir }}/ca.pem
        --cert {{ cca_cert_dir }}/node.pem --key {{ cca_cert_dir }}/node-key.pem
        https://{{ ansible_host }}:9770/healthz
      retries: 15
      delay: 2
      register: server_ready
      until: server_ready.rc == 0

    - name: Apply Airflow deployment
      become: true
      command: /usr/local/bin/cca apply /tmp/airflow-test-app.cca

    - name: Wait for Airflow containers to start
      pause:
        seconds: 45

    - name: Verify Airflow instances are running
      command: >
        curl -sf
        --cacert {{ cca_cert_dir }}/ca.pem
        --cert {{ cca_cert_dir }}/node.pem
        --key {{ cca_cert_dir }}/node-key.pem
        -H "Accept: application/json"
        https://{{ ansible_host }}:9770/status
      register: cluster_status

    - name: Show running instances
      debug:
        msg: "{{ (cluster_status.stdout | from_json).instances | map(attribute='id') | list }}"

    - name: Verify Airflow webserver is responding on HTTPS
      shell: >
        curl -sk https://localhost:443/health || true
      become: true
      delegate_to: "{{ groups['workers'][0] }}"
      register: airflow_health

    - name: Show Airflow health check result
      debug:
        msg: "{{ airflow_health.stdout }}"
