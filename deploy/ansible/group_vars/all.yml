nerdctl_version: "2.0.3"
cni_plugins_version: "1.9.1"

go_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

cca_cert_dir: /etc/ccattler/pki

cca_runtime: "container"

# Network CIDRs — override these per-run to verify no hardcoded values.
# cluster_cidr: overlay network for container IPs (each node gets a /24 subnet).
# vip_cidr: service virtual IP pool (one VIP per service with exposed ports).
cluster_cidr: "10.100.0.0/16"
vip_cidr: "10.200.0.0/24"

# network_mode: "local" (bridge only, same-node containers) or "vxlan" (cross-node overlay).
network_mode: "vxlan"
