nerdctl_version: "2.0.3"
cni_plugins_version: "1.9.1"

go_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

cca_cert_dir: /etc/ccattler/pki

cca_runtime: "container"

# Network CIDRs — randomized on every deployment to prove nothing is hardcoded.
# cluster_cidr: overlay network for container IPs (each node gets a /24 subnet).
# vip_cidr: service virtual IP pool (one VIP per service with exposed ports).
# The seed ensures all hosts in the same run get the same CIDR.
_deploy_seed: "{{ lookup('pipe', 'date +%s') }}"
cluster_cidr: "10.{{ 99 | random(start=30, seed=_deploy_seed) }}.0.0/16"
vip_cidr: "10.{{ 249 | random(start=150, seed=_deploy_seed + 'vip') }}.0.0/24"

# network_mode: "local" (bridge only, same-node containers) or "vxlan" (cross-node overlay).
network_mode: "vxlan"

# dataplane_backend: "auto" (nftables→iptables fallback), "nftables", "iptables", "shadow", or "ebpf".
dataplane_backend: "auto"

# proxy_port: port where the agent reverse proxy listens on each node's physical IP.
proxy_port: 8080
