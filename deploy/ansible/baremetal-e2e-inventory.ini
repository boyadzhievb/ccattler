# Bare-metal E2E HA cluster (100.215/30/31/51)
#   node-1 (100.215): etcd + control plane
#   node-2 (100.30):  etcd + control plane
#   node-3 (100.31):  etcd + control plane
#   node-4 (100.51):  worker
#
# 3-node etcd raft quorum + 3-node leader-elected cca-server + 1 worker.
# Deploy:
#   ansible-playbook -i baremetal-e2e-inventory.ini ha-deploy.yml

[etcd]
node-1 ansible_host=192.168.100.215
node-2 ansible_host=192.168.100.30
node-3 ansible_host=192.168.100.31

[controlplane]
node-1
node-2
node-3

[workers]
node-4 ansible_host=192.168.100.51

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=bozhan
ansible_ssh_private_key_file=~/.ssh/id_rsa_dell_bozhan
ansible_ssh_common_args=-o StrictHostKeyChecking=no
etcd_endpoints=https://192.168.100.215:2379,https://192.168.100.30:2379,https://192.168.100.31:2379
