# Bare-metal E2E cluster (non-HA): 1 control plane + 2 workers
#   node-1 (100.215): etcd + control plane
#   node-2 (100.30):  worker
#   node-3 (100.31):  worker
#
# Deploy:
#   ansible-playbook -i baremetal-e2e-inventory.ini baremetal-deploy.yml

[etcd]
node-1 ansible_host=192.168.100.215

[controlplane]
node-1

[workers]
node-2 ansible_host=192.168.100.30
node-3 ansible_host=192.168.100.31

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=bozhan
ansible_ssh_private_key_file=~/.ssh/id_rsa_dell_bozhan
ansible_ssh_common_args=-o StrictHostKeyChecking=no
etcd_endpoints=https://192.168.100.215:2379
