---
# High-Availability CCattler cluster deployment
#
# Topology:
#   3 control-plane nodes: etcd (3-node raft) + cca-server (leader-elected controllers)
#   N worker nodes: cca-agent + containerd
#
# Prerequisites:
#   - 3+ Debian/Ubuntu servers with SSH access
#   - Fill in IPs in ha-inventory.ini
#   - Build cca binary: go build -o deploy/ansible/cca-linux-amd64 ./cmd/cca/
#
# Run:
#   cd deploy/ansible
#   ansible-playbook -i ha-inventory.ini ha-deploy.yml
#
# Deploy demo workload after cluster is up:
#   ansible-playbook -i ha-inventory.ini ha-deploy.yml --tags testapp
#
# Skip cleanup on re-runs:
#   ansible-playbook -i ha-inventory.ini ha-deploy.yml --skip-tags cleanup

- name: Clean up old state (skip with --skip-tags cleanup)
  hosts: all
  become: true
  tags: [cleanup]
  roles:
    - cleanup

- name: Common setup on all nodes
  hosts: all
  become: true
  roles:
    - common

- name: Set up HA control plane — generate and distribute PKI
  hosts: controlplane
  become: true
  serial: 1
  roles:
    - ha-controlplane

- name: Form etcd 3-node raft cluster
  hosts: etcd
  become: true
  roles:
    - etcd-cluster

- name: Restart cca-server after etcd cluster is healthy
  hosts: controlplane
  become: true
  tasks:
    - name: Restart cca-server to connect to etcd cluster
      systemd:
        name: cca-server
        state: restarted

    - name: Wait for cca-server API to respond
      wait_for:
        host: "{{ ansible_host }}"
        port: 9770
        timeout: 45

- name: Verify HA — confirm leader election and API on all nodes
  hosts: controlplane
  become: true
  tasks:
    - name: Check cca-server health on each node
      shell: >
        curl -sf
        --cacert {{ cca_cert_dir }}/ca.pem
        --cert {{ cca_cert_dir }}/node.pem
        --key {{ cca_cert_dir }}/node-key.pem
        https://{{ ansible_host }}:9770/healthz
      retries: 10
      delay: 3
      register: server_health
      until: server_health.rc == 0
      changed_when: false

    - name: Display server health
      debug:
        msg: "cca-server on {{ inventory_hostname }} ({{ ansible_host }}): healthy"

- name: Provision worker nodes
  hosts: workers
  become: true
  roles:
    - worker

- name: Deploy demo workload
  hosts: controlplane[0]
  become: true
  tags: [testapp, never]
  tasks:
    - name: Copy demo workload config
      copy:
        src: "{{ playbook_dir }}/baremetal-demo.cca"
        dest: /tmp/baremetal-demo.cca
        mode: "0644"

    - name: Wait for CCattler server to be ready
      shell: >
        curl -sf --cacert {{ cca_cert_dir }}/ca.pem
        --cert {{ cca_cert_dir }}/node.pem --key {{ cca_cert_dir }}/node-key.pem
        https://{{ ansible_host }}:9770/healthz
      retries: 15
      delay: 2
      register: server_ready
      until: server_ready.rc == 0

    - name: Apply demo workload
      command: /usr/local/bin/cca apply /tmp/baremetal-demo.cca

    - name: Wait for workload to converge
      pause:
        seconds: 30

    - name: Show cluster status
      command: >
        curl -sf
        --cacert {{ cca_cert_dir }}/ca.pem
        --cert {{ cca_cert_dir }}/node.pem
        --key {{ cca_cert_dir }}/node-key.pem
        -H "Accept: application/json"
        https://{{ ansible_host }}:9770/status
      register: cluster_status

    - name: Display running instances
      debug:
        msg: "{{ (cluster_status.stdout | from_json).instances | map(attribute='id') | list }}"
