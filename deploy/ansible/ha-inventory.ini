# HA control-plane cluster — 3 control nodes (etcd + cca-server), N workers
#
# Each control-plane node runs:
#   - etcd (3-node raft cluster)
#   - cca-server (leader election via etcd — one active controller, all serve API)
#
# Workers connect to all 3 etcd endpoints for redundancy.
#
# Adjust IPs and ansible_user to match your environment.

[etcd]
cp-1 ansible_host=192.168.100.11
cp-2 ansible_host=192.168.100.12
cp-3 ansible_host=192.168.100.13

[controlplane]
cp-1
cp-2
cp-3

[workers]
worker-1 ansible_host=192.168.100.21
worker-2 ansible_host=192.168.100.22
worker-3 ansible_host=192.168.100.23

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=bozhan
ansible_ssh_private_key_file=~/.ssh/id_rsa
ansible_ssh_common_args=-o StrictHostKeyChecking=no
etcd_endpoints=https://192.168.100.11:2379,https://192.168.100.12:2379,https://192.168.100.13:2379
