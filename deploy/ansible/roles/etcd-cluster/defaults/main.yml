---
# How often ccattler-etcd-peer-firewall-sync.timer re-applies the etcd peer
# port firewall: the longest time the peer rule can be missing after something
# flushed the ruleset (M280, user decision "go for a").
etcd_peer_firewall_sync_interval: 30s
# Timer accuracy: the rule is missing for at most one interval plus this
# (about 31 s by default); systemd's default (1 min) would triple that.
etcd_peer_firewall_sync_accuracy: 1s
# Start timeout of the sync service, shorter than the interval: a oneshot has
# no start timeout by default, so a hung nft would stop the timer (SA7-L1).
etcd_peer_firewall_sync_start_timeout: 20s
