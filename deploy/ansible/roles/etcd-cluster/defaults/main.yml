---
# How often ccattler-etcd-peer-firewall-sync.timer re-applies the etcd peer
# port firewall: the longest time the peer rule can be missing after something
# flushed the ruleset (M280, user decision "go for a").
etcd_peer_firewall_sync_interval: 30s
# Timer accuracy: systemd's default (1 min) would stretch that exposure past
# one interval.
etcd_peer_firewall_sync_accuracy: 1s
