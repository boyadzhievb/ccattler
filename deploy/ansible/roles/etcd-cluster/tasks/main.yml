---
# Configure etcd as a multi-node raft cluster.
# Expects: groups['etcd'] has 3+ hosts, cca PKI already distributed.

- name: Build etcd initial-cluster string from inventory
  set_fact:
    etcd_initial_cluster: >-
      {% set members = [] %}
      {% for node in groups['etcd'] %}
      {% set _ = members.append(node + '=https://' + hostvars[node].ansible_host + ':2380') %}
      {% endfor %}
      {{ members | join(',') }}

- name: Stop etcd before reconfiguration
  systemd:
    name: etcd
    state: stopped
  failed_when: false

- name: Remove single-node etcd data (fresh cluster bootstrap)
  file:
    path: /var/lib/etcd
    state: absent

# Distribution packages run etcd as user etcd (Debian, Ubuntu); otherwise root.
- name: Look up the etcd service user
  getent:
    database: passwd
    key: etcd
    fail_key: false

- name: Recreate etcd data directory
  file:
    path: /var/lib/etcd
    state: directory
    owner: "{{ 'etcd' if getent_passwd.etcd is not none else 'root' }}"
    group: "{{ 'etcd' if getent_passwd.etcd is not none else 'root' }}"
    mode: "0700"

- name: Create etcd systemd drop-in directory
  file:
    path: /etc/systemd/system/etcd.service.d
    state: directory
    mode: "0755"

- name: Remove the drop-in name used before it sorted after tls.conf
  file:
    path: /etc/systemd/system/etcd.service.d/cluster.conf
    state: absent

- name: Install etcd cluster drop-in
  template:
    src: etcd-cluster.conf.j2
    dest: /etc/systemd/system/etcd.service.d/zz-cluster.conf
    mode: "0644"

# Only the etcd members reach the peer port (M280 SA-L1): a worker's etcd client
# certificate comes from the same CA etcd trusts for peers.
- name: Install the etcd peer port firewall rules
  template:
    src: etcd-peer-firewall.nft.j2
    dest: /etc/ccattler/etcd-peer-firewall.nft
    mode: "0644"
  register: etcd_peer_firewall_rules

- name: Install the unit that loads the etcd peer port firewall at boot
  copy:
    dest: /etc/systemd/system/ccattler-etcd-peer-firewall.service
    mode: "0644"
    content: |
      [Unit]
      Description=CCattler: only etcd members reach the etcd peer port 2380
      Before=etcd.service
      After=network-pre.target

      [Service]
      Type=oneshot
      RemainAfterExit=true
      ExecStart=/usr/sbin/nft -f /etc/ccattler/etcd-peer-firewall.nft

      [Install]
      WantedBy=multi-user.target

# started, never restarted: etcd Requires= this unit (SA2-L5, zz-cluster.conf),
# so restarting it would restart etcd on every member at once.
- name: Load the etcd peer port firewall now and at boot
  systemd:
    name: ccattler-etcd-peer-firewall
    state: started
    enabled: true
    daemon_reload: true

# "systemctl restart nftables" flushes the ruleset while etcd keeps running
# (SA4-L4). This unit is part of nftables.service: it is restarted with it and
# runs after it, re-applying the peer rules. etcd does not require it, so an
# nftables restart never restarts etcd.
- name: Install the unit that re-applies the etcd peer port firewall after nftables restarts
  copy:
    dest: /etc/systemd/system/ccattler-etcd-peer-firewall-reload.service
    mode: "0644"
    content: |
      [Unit]
      Description=CCattler: re-apply the etcd peer port firewall when nftables restarts
      PartOf=nftables.service
      After=nftables.service

      [Service]
      Type=oneshot
      RemainAfterExit=true
      ExecStart=/usr/sbin/nft -f /etc/ccattler/etcd-peer-firewall.nft

      [Install]
      WantedBy=nftables.service

- name: Enable the etcd peer port firewall reload unit
  systemd:
    name: ccattler-etcd-peer-firewall-reload
    state: started
    enabled: true
    daemon_reload: true

- name: Reload changed etcd peer port firewall rules (atomic table replace)
  command: /usr/sbin/nft -f /etc/ccattler/etcd-peer-firewall.nft
  when: etcd_peer_firewall_rules.changed

- name: Reload systemd and start etcd cluster
  systemd:
    name: etcd
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for etcd to accept connections
  shell: >
    ETCDCTL_API=3 etcdctl
    --endpoints https://{{ ansible_host }}:2379
    --cacert {{ cca_cert_dir }}/{{ cca_pki.etcd_ca }}
    --cert {{ cca_cert_dir }}/{{ cca_pki.node_etcd_cert }}
    --key {{ cca_cert_dir }}/{{ cca_pki.node_etcd_key }}
    endpoint health
  retries: 15
  delay: 3
  register: etcd_health
  until: etcd_health.rc == 0
  changed_when: false

- name: Verify etcd cluster has quorum
  shell: >
    ETCDCTL_API=3 etcdctl
    --endpoints https://{{ ansible_host }}:2379
    --cacert {{ cca_cert_dir }}/{{ cca_pki.etcd_ca }}
    --cert {{ cca_cert_dir }}/{{ cca_pki.node_etcd_cert }}
    --key {{ cca_cert_dir }}/{{ cca_pki.node_etcd_key }}
    member list -w table
  register: etcd_members
  changed_when: false
  run_once: true

- name: Display etcd cluster members
  debug:
    msg: "{{ etcd_members.stdout_lines }}"
  run_once: true
