---
- name: Download etcd {{ etcd_version }}
  get_url:
    url: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /tmp/etcd.tar.gz

- name: Extract etcd
  unarchive:
    src: /tmp/etcd.tar.gz
    dest: /tmp
    remote_src: true

- name: Install etcd binaries
  copy:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
    remote_src: true
  loop:
    - etcd
    - etcdctl

- name: Create etcd data directory
  file:
    path: /var/lib/etcd
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install etcd systemd unit
  template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
  notify: restart etcd

- name: Enable and start etcd
  systemd:
    name: etcd
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for etcd to be healthy
  command: >
    etcdctl --endpoints=http://{{ ansible_host }}:2379 endpoint health
  register: etcd_health
  retries: 10
  delay: 3
  until: etcd_health.rc == 0
  changed_when: false
