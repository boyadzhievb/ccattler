---
- name: Check Ubuntu version
  assert:
    that:
      - ansible_distribution == "Ubuntu" or ansible_distribution == "Debian"
      - ansible_distribution_major_version | int >= 22 or ansible_distribution == "Debian"
    fail_msg: "CCattler requires Ubuntu 22.04+ or Debian 12+ (found {{ ansible_distribution }} {{ ansible_distribution_version }}). Python 3.9+ and OpenSSL 3.0+ are needed."

- name: Verify CCattler binary exists
  stat:
    path: "{{ playbook_dir }}/cca-linux-{{ go_arch }}"
  delegate_to: localhost
  run_once: true
  become: false
  register: ccattler_binary

- name: Fail if binary is missing
  fail:
    msg: "cca-linux-{{ go_arch }} not found in {{ playbook_dir }}/ — install.sh downloads it from releases automatically"
  when: not ccattler_binary.stat.exists
  run_once: true

- name: Disable systemd-resolved
  systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  ignore_errors: true
  tags: [dns]

- name: Bootstrap resolv.conf for apt (before dnsmasq is installed)
  copy:
    dest: /etc/resolv.conf
    content: "nameserver {{ ansible_host | regex_replace('\\.\\d+$', '.1') }}\n"
    mode: "0644"
  tags: [dns]

- name: Disable IPv6 to prevent AAAA lookups on IPv4-only networks
  sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: true
    reload: true
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
  ignore_errors: true

- name: Install base packages
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - dnsmasq
    state: present
    update_cache: true

- name: Install etcd from distribution packages
  apt:
    name: etcd-server
    state: present
  when: "'etcd' in group_names"

- name: Configure dnsmasq upstream servers
  copy:
    dest: /etc/dnsmasq.d/upstream.conf
    content: |
      server={{ ansible_host | regex_replace('\.\d+$', '.1') }}
      cache-size=1000
    mode: "0644"
  notify: restart dnsmasq
  tags: [dns]

- name: Forward service DNS to CCattler DNS servers (all control-plane nodes)
  copy:
    dest: /etc/dnsmasq.d/ccattler-dns.conf
    content: |
      {% for cp_node in groups['controlplane'] %}
      server=/cca.local/{{ hostvars[cp_node].ansible_host }}#15353
      {% endfor %}
    mode: "0644"
  when: groups['controlplane'] is defined and groups['controlplane'] | length > 0
  notify: restart dnsmasq
  tags: [dns]

- name: Point resolv.conf at dnsmasq and private network gateway
  copy:
    dest: /etc/resolv.conf
    content: "nameserver 127.0.0.1\nnameserver {{ ansible_host | regex_replace('\\.\\d+$', '.1') }}\n"
    mode: "0644"
  tags: [dns]

- name: Enable and start dnsmasq
  systemd:
    name: dnsmasq
    state: started
    enabled: true

- name: Install containerd
  apt:
    name: containerd
    state: present
    update_cache: true

- name: Install nerdctl
  get_url:
    url: "https://github.com/containerd/nerdctl/releases/download/v{{ nerdctl_version }}/nerdctl-{{ nerdctl_version }}-linux-{{ go_arch }}.tar.gz"
    dest: /tmp/nerdctl.tar.gz
  register: nerdctl_download

- name: Extract nerdctl
  unarchive:
    src: /tmp/nerdctl.tar.gz
    dest: /usr/local/bin
    remote_src: true
  when: nerdctl_download.changed

- name: Install CNI plugins
  get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-{{ go_arch }}-v{{ cni_plugins_version }}.tgz"
    dest: /tmp/cni-plugins.tgz
  register: cni_download

- name: Create CNI plugins directory
  file:
    path: /opt/cni/bin
    state: directory
    mode: "0755"

- name: Extract CNI plugins
  unarchive:
    src: /tmp/cni-plugins.tgz
    dest: /opt/cni/bin
    remote_src: true
  when: cni_download.changed

- name: Copy CCattler binary to node
  copy:
    src: "{{ playbook_dir }}/cca-linux-{{ go_arch }}"
    dest: /usr/local/bin/cca
    mode: "0755"

- name: Verify cca binary
  command: /usr/local/bin/cca version
  changed_when: false

- name: Create CCattler directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/ccattler
    - /etc/ccattler/pki
    - /var/lib/ccattler
    - /var/log/ccattler

- name: Write etcd endpoints config
  copy:
    dest: /etc/ccattler/endpoints
    content: "{{ etcd_endpoints }}\n"
    mode: "0600"
