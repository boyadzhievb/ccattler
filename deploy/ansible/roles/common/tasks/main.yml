---
- name: Verify CCattler binary exists
  stat:
    path: "{{ playbook_dir }}/cca-linux-amd64"
  delegate_to: localhost
  run_once: true
  become: false
  register: ccattler_binary

- name: Fail if binary is missing
  fail:
    msg: "Place cca-linux-amd64 in {{ playbook_dir }}/ before running (download from releases or build with: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o cca-linux-amd64 ./cmd/cca)"
  when: not ccattler_binary.stat.exists
  run_once: true

- name: Install base packages
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: Add Docker GPG key
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Add Docker apt repository
  copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: >
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable

- name: Install containerd.io
  apt:
    name: containerd.io
    state: present
    update_cache: true

- name: Copy CCattler binary to node
  copy:
    src: "{{ playbook_dir }}/cca-linux-amd64"
    dest: /usr/local/bin/cca
    mode: "0755"

- name: Verify cca binary
  command: /usr/local/bin/cca --help
  changed_when: false

- name: Create CCattler directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/ccattler
    - /etc/ccattler/pki
    - /var/lib/ccattler
    - /var/log/ccattler
