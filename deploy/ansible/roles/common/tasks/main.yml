---
- name: Check Ubuntu version
  assert:
    that:
      - ansible_distribution == "Ubuntu" or ansible_distribution == "Debian"
      - ansible_distribution_major_version | int >= 22 or ansible_distribution == "Debian"
    fail_msg: "CCattler requires Ubuntu 22.04+ or Debian 12+ (found {{ ansible_distribution }} {{ ansible_distribution_version }}). Python 3.9+ and OpenSSL 3.0+ are needed."

- name: Build CCattler binary for target architecture
  command: go build -o "{{ playbook_dir }}/cca-linux-{{ go_arch }}" ./cmd/cca/
  args:
    chdir: "{{ playbook_dir }}/../.."
  environment:
    GOOS: linux
    GOARCH: "{{ go_arch }}"
    CGO_ENABLED: "0"
  delegate_to: localhost
  run_once: true
  become: false

- name: Disable systemd-resolved
  systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  ignore_errors: true
  tags: [dns]

- name: Bootstrap resolv.conf for apt (before dnsmasq is installed)
  copy:
    dest: /etc/resolv.conf
    content: "nameserver {{ ansible_host | regex_replace('\\.\\d+$', '.1') }}\n"
    mode: "0644"
  tags: [dns]

- name: Load br_netfilter kernel module
  modprobe:
    name: br_netfilter
    state: present
  ignore_errors: true

- name: Persist br_netfilter across reboots
  copy:
    dest: /etc/modules-load.d/ccattler.conf
    content: "br_netfilter\n"
    mode: "0644"

- name: Enable IP forwarding for VXLAN overlay
  sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/99-ccattler.conf
    reload: true

- name: Enable bridge netfilter call-iptables
  sysctl:
    name: net.bridge.bridge-nf-call-iptables
    value: "1"
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/99-ccattler.conf
    reload: true
  ignore_errors: true

- name: Disable IPv6 to prevent AAAA lookups on IPv4-only networks
  sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: true
    reload: true
  loop:
    - net.ipv6.conf.all.disable_ipv6
    - net.ipv6.conf.default.disable_ipv6
  ignore_errors: true

- name: Allow VXLAN traffic through ufw
  ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop:
    - { port: "4789", proto: "udp", comment: "CCattler VXLAN" }
    - { port: "9770", proto: "tcp", comment: "CCattler API" }
    - { port: "2379", proto: "tcp", comment: "etcd client" }
  when: ansible_facts.services is defined and ansible_facts.services.get('ufw.service', {}).get('state') == 'running'
  ignore_errors: true

- name: Set iptables FORWARD policy to ACCEPT for overlay routing
  iptables:
    chain: FORWARD
    policy: ACCEPT

- name: Remove stale CNI iptables chains
  shell: |
    for chain in CNI-ISOLATION-STAGE-1 CNI-ISOLATION-STAGE-2 CNI-FORWARD; do
      iptables -F "$chain" 2>/dev/null
      iptables -X "$chain" 2>/dev/null
    done
  changed_when: false
  ignore_errors: true

- name: Install base packages
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - dnsmasq
    state: present
    update_cache: true

- name: Install etcd from distribution packages
  apt:
    name: etcd-server
    state: present
  when: "'etcd' in group_names"

- name: Configure dnsmasq upstream servers
  copy:
    dest: /etc/dnsmasq.d/upstream.conf
    content: |
      server={{ ansible_host | regex_replace('\.\d+$', '.1') }}
      cache-size=1000
    mode: "0644"
  notify: restart dnsmasq
  tags: [dns]

- name: Forward service DNS to CCattler DNS servers (all control-plane nodes)
  copy:
    dest: /etc/dnsmasq.d/ccattler-dns.conf
    content: |
      {% for cp_node in groups['controlplane'] %}
      server=/cca.local/{{ hostvars[cp_node].ansible_host }}#15353
      {% endfor %}
    mode: "0644"
  when: groups['controlplane'] is defined and groups['controlplane'] | length > 0
  notify: restart dnsmasq
  tags: [dns]

- name: Point resolv.conf at dnsmasq and private network gateway
  copy:
    dest: /etc/resolv.conf
    content: "nameserver 127.0.0.1\nnameserver {{ ansible_host | regex_replace('\\.\\d+$', '.1') }}\n"
    mode: "0644"
  tags: [dns]

- name: Enable and start dnsmasq
  systemd:
    name: dnsmasq
    state: started
    enabled: true

- name: Install containerd
  apt:
    name: containerd
    state: present
    update_cache: true

- name: Check if nerdctl is already installed
  stat:
    path: /usr/local/bin/nerdctl
  register: nerdctl_binary

- name: Download nerdctl
  command:
    cmd: "curl -sSL -o /tmp/nerdctl.tar.gz https://github.com/containerd/nerdctl/releases/download/v{{ nerdctl_version }}/nerdctl-{{ nerdctl_version }}-linux-{{ go_arch }}.tar.gz"
    creates: /tmp/nerdctl.tar.gz
  when: not nerdctl_binary.stat.exists

- name: Extract nerdctl
  unarchive:
    src: /tmp/nerdctl.tar.gz
    dest: /usr/local/bin
    remote_src: true
  when: not nerdctl_binary.stat.exists

- name: Check if CNI plugins are already installed
  stat:
    path: /opt/cni/bin/bridge
  register: cni_binary

- name: Download CNI plugins
  command:
    cmd: "curl -sSL -o /tmp/cni-plugins.tgz https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-{{ go_arch }}-v{{ cni_plugins_version }}.tgz"
    creates: /tmp/cni-plugins.tgz
  when: not cni_binary.stat.exists

- name: Create CNI plugins directory
  file:
    path: /opt/cni/bin
    state: directory
    mode: "0755"

- name: Extract CNI plugins
  unarchive:
    src: /tmp/cni-plugins.tgz
    dest: /opt/cni/bin
    remote_src: true
  when: not cni_binary.stat.exists

- name: Copy CCattler binary to node
  copy:
    src: "{{ playbook_dir }}/cca-linux-{{ go_arch }}"
    dest: /usr/local/bin/cca
    mode: "0755"

- name: Verify cca binary
  command: /usr/local/bin/cca version
  changed_when: false

- name: Install clang for BPF compilation
  apt:
    name: clang
    state: present
  when: dataplane_backend == "ebpf"

- name: Copy BPF source files to node
  copy:
    src: "{{ playbook_dir }}/../../network/ebpf/"
    dest: /tmp/cca-ebpf/
    mode: "0644"
  when: dataplane_backend == "ebpf"

- name: Create BPF output directory
  file:
    path: /usr/lib/cca
    state: directory
    mode: "0755"
  when: dataplane_backend == "ebpf"

- name: Compile BPF programs on node
  shell: |
    clang -O2 -g -Wall -Werror -target bpf -D__TARGET_ARCH_x86 \
      -I/usr/include -I/usr/include/x86_64-linux-gnu \
      -c /tmp/cca-ebpf/{{ item.src }} -o /usr/lib/cca/{{ item.out }}
  loop:
    - { src: "cca_socket_lb.c", out: "cca_ebpf.o" }
    - { src: "cca_tc_dnat.c", out: "cca_tc_dnat.o" }
    - { src: "cca_tc_snat.c", out: "cca_tc_snat.o" }
  when: dataplane_backend == "ebpf"

- name: Create CCattler directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/ccattler
    - /etc/ccattler/pki
    - /var/lib/ccattler
    - /var/log/ccattler

- name: Write etcd endpoints config
  copy:
    dest: /etc/ccattler/endpoints
    content: "{{ etcd_endpoints }}\n"
    mode: "0600"
