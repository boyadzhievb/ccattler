---
- name: Verify CCattler binary exists
  stat:
    path: "{{ playbook_dir }}/cca-linux-amd64"
  delegate_to: localhost
  run_once: true
  become: false
  register: ccattler_binary

- name: Fail if binary is missing
  fail:
    msg: "Place cca-linux-amd64 in {{ playbook_dir }}/ before running (download from releases or build with: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o cca-linux-amd64 ./cmd/cca)"
  when: not ccattler_binary.stat.exists
  run_once: true

- name: Install base packages
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: Install containerd
  apt:
    name: containerd
    state: present
    update_cache: true

- name: Install nerdctl
  get_url:
    url: "https://github.com/containerd/nerdctl/releases/download/v{{ nerdctl_version }}/nerdctl-{{ nerdctl_version }}-linux-amd64.tar.gz"
    dest: /tmp/nerdctl.tar.gz
  register: nerdctl_download

- name: Extract nerdctl
  unarchive:
    src: /tmp/nerdctl.tar.gz
    dest: /usr/local/bin
    remote_src: true
  when: nerdctl_download.changed

- name: Install CNI plugins
  get_url:
    url: "https://github.com/containernetworking/plugins/releases/download/v{{ cni_plugins_version }}/cni-plugins-linux-amd64-v{{ cni_plugins_version }}.tgz"
    dest: /tmp/cni-plugins.tgz
  register: cni_download

- name: Create CNI plugins directory
  file:
    path: /opt/cni/bin
    state: directory
    mode: "0755"

- name: Extract CNI plugins
  unarchive:
    src: /tmp/cni-plugins.tgz
    dest: /opt/cni/bin
    remote_src: true
  when: cni_download.changed

- name: Copy CCattler binary to node
  copy:
    src: "{{ playbook_dir }}/cca-linux-amd64"
    dest: /usr/local/bin/cca
    mode: "0755"

- name: Verify cca binary
  command: /usr/local/bin/cca version
  changed_when: false

- name: Create CCattler directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/ccattler
    - /etc/ccattler/pki
    - /var/lib/ccattler
    - /var/log/ccattler
