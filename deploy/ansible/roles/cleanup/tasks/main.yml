---
- name: Stop cca-agent if running
  systemd:
    name: cca-agent
    state: stopped
    enabled: false
  failed_when: false

- name: Stop cca-server if running
  systemd:
    name: cca-server
    state: stopped
    enabled: false
  failed_when: false

- name: Stop etcd if running
  systemd:
    name: etcd
    state: stopped
    enabled: false
  failed_when: false
  when: "'etcd' in group_names"

- name: Remove old systemd units and drop-ins
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/cca-agent.service
    - /etc/systemd/system/cca-server.service
    - /etc/systemd/system/etcd.service
    - /etc/systemd/system/etcd.service.d

- name: Reload systemd
  systemd:
    daemon_reload: true

- name: Remove CCattler certificates and config
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/ccattler/pki
    - /etc/ccattler
    - /var/lib/ccattler
    - /var/lib/cca/volumes
    - /var/log/ccattler

# Every data plane backend's state (nftables table, iptables CCA_* chains, eBPF
# pins), so a redeploy with another --dataplane starts clean.
- name: Remove data plane state of every backend
  shell: |
    nft delete table ip cca 2>/dev/null
    for table in nat filter; do
      iptables -t $table -S 2>/dev/null | grep -- '-j CCA_' | sed 's/^-A /-D /' |
        while read -r rule; do iptables -t $table $rule; done
      for chain in $(iptables -t $table -S 2>/dev/null | awk '/^-N CCA_/{print $2}'); do iptables -t $table -F "$chain"; done
      for chain in $(iptables -t $table -S 2>/dev/null | awk '/^-N CCA_/{print $2}'); do iptables -t $table -X "$chain"; done
    done
    rm -rf /sys/fs/bpf/cca
    true
  args:
    executable: /bin/bash
  changed_when: false

- name: Remove etcd data
  file:
    path: /var/lib/etcd
    state: absent
  when: "'etcd' in group_names"

- name: Remove old cca binary
  file:
    path: /usr/local/bin/cca
    state: absent
