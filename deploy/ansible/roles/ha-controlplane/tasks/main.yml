---
# HA control-plane setup. Runs on all control-plane nodes.
# The first node generates PKI via "cca init"; other nodes receive copies.
# Leader election in cca-server ensures only one controller is active.

# Keys pass through the Ansible controller: stage them in a fresh private
# (0700) directory per run, never a fixed world-readable /tmp path, and delete
# it once distributed (M177 review: root key and CA key were left in /tmp).
- name: Create a private staging directory on the Ansible controller
  tempfile:
    state: directory
    suffix: ccattler-ha-pki
  register: ha_pki_staging
  delegate_to: localhost
  run_once: true
  become: false

- name: Generate PKI on the first control-plane node
  command: >
    /usr/local/bin/cca init
    --advertise-address {{ ansible_host }}
    --node-id {{ inventory_hostname }}
    --cluster-cidr {{ cluster_cidr }}
    --vip-cidr {{ vip_cidr }}
    -o /tmp/cca-init
  args:
    creates: /tmp/cca-init/setup.sh
  when: inventory_hostname == groups['controlplane'][0]

- name: Run setup script on the first node (installs PKI and systemd units)
  command: /tmp/cca-init/setup.sh
  args:
    creates: /etc/ccattler/pki/ca.pem
  when: inventory_hostname == groups['controlplane'][0]

- name: Generate secret root key on the first node (clusters that predate M177)
  command: /usr/local/bin/cca secret generate-root-key
  args:
    creates: /etc/ccattler/secret-root.key
  register: secret_root_key_generation
  # A binary older than M177 has no such subcommand (it prints the secret
  # usage) and needs no root key; any other failure stops the play.
  failed_when: >-
    secret_root_key_generation.rc != 0 and
    'usage: cca secret' not in secret_root_key_generation.stderr
  when: inventory_hostname == groups['controlplane'][0]

# Every replica must hold the first node's secret keys (Flow 29); before M177
# each secondary generated its own secret-master.key. A secondary's differing
# key is kept as secret-master.key.<timestamp>~: v1 secrets it wrote open only
# with it (they show as unreadable_count; recovery in design/TESTING.md).
# A binary older than M177 has no root key yet: nothing is fetched or copied.
- name: Fetch the secret root key from the first control-plane node (if any)
  fetch:
    src: /etc/ccattler/secret-root.key
    dest: "{{ ha_pki_staging.path }}/"
    flat: true
    fail_on_missing: false
  when: inventory_hostname == groups['controlplane'][0]

# Only clusters set up before M177 have a legacy key; new clusters have none,
# and after retirement it is never fetched again.
- name: Fetch the legacy secret master key from the first control-plane node (if any)
  fetch:
    src: /etc/ccattler/secret-master.key
    dest: "{{ ha_pki_staging.path }}/"
    flat: true
    fail_on_missing: false
  when:
    - inventory_hostname == groups['controlplane'][0]
    - not (retire_legacy_secret_key | default(false) | bool)

- name: Ensure the configuration directory exists on other control-plane nodes
  file:
    path: /etc/ccattler
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: inventory_hostname != groups['controlplane'][0]

- name: Distribute secret root key to other control-plane nodes
  copy:
    src: "{{ ha_pki_staging.path }}/secret-root.key"
    dest: /etc/ccattler/secret-root.key
    owner: root
    group: root
    mode: "0400"
  when:
    - inventory_hostname != groups['controlplane'][0]
    - lookup('ansible.builtin.fileglob', ha_pki_staging.path ~ '/secret-root.key') | length > 0
  notify: restart cca-server

- name: Distribute legacy secret master key to other control-plane nodes
  copy:
    src: "{{ ha_pki_staging.path }}/secret-master.key"
    dest: /etc/ccattler/secret-master.key
    owner: root
    group: root
    mode: "0600"
    backup: true
  when:
    - inventory_hostname != groups['controlplane'][0]
    - lookup('ansible.builtin.fileglob', ha_pki_staging.path ~ '/secret-master.key') | length > 0
    - not (retire_legacy_secret_key | default(false) | bool)
  notify: restart cca-server

# Only after 'cca secret retire-legacy-key' succeeded (Flow 29 step 7): run the
# playbook with -e retire_legacy_secret_key=true to delete the retired key and
# its backup copies (secret-master.key.<timestamp>~) from every replica.
- name: Find the retired legacy secret master key and its backups on every replica
  find:
    paths: /etc/ccattler
    patterns: "secret-master.key*"
  register: replica_legacy_key_files
  when: retire_legacy_secret_key | default(false) | bool

- name: Remove the retired legacy secret master key and its backups from every replica
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ replica_legacy_key_files.files | default([]) }}"
  when: retire_legacy_secret_key | default(false) | bool

- name: Assert no legacy secret master key copy is left on any replica
  find:
    paths: /etc/ccattler
    patterns: "secret-master.key*"
  register: replica_legacy_key_leftovers
  failed_when: replica_legacy_key_leftovers.matched > 0
  when: retire_legacy_secret_key | default(false) | bool

- name: Fetch CA and shared PKI from the first control-plane node
  fetch:
    src: "{{ item }}"
    dest: "{{ ha_pki_staging.path }}/"
    flat: true
  loop:
    - /etc/ccattler/pki/ca.pem
    - /etc/ccattler/pki/ca-key.pem
  when: inventory_hostname == groups['controlplane'][0]

- name: Fetch node cert and key from the first node (used as template)
  fetch:
    src: "{{ item }}"
    dest: "{{ ha_pki_staging.path }}/"
    flat: true
  loop:
    - /etc/ccattler/pki/node.pem
    - /etc/ccattler/pki/node-key.pem
  when: inventory_hostname == groups['controlplane'][0]

- name: Distribute CA to other control-plane nodes
  copy:
    src: "{{ ha_pki_staging.path }}/{{ item }}"
    dest: "{{ cca_cert_dir }}/{{ item }}"
    mode: "0600"
  loop:
    - ca.pem
    - ca-key.pem
  when: inventory_hostname != groups['controlplane'][0]

- name: Delete the private staging directory on the Ansible controller
  file:
    path: "{{ ha_pki_staging.path }}"
    state: absent
  delegate_to: localhost
  run_once: true
  become: false

- name: Generate per-node certificates on secondary control-plane nodes
  command: >
    /usr/local/bin/cca init
    --advertise-address {{ ansible_host }}
    --node-id {{ inventory_hostname }}
    --cluster-cidr {{ cluster_cidr }}
    --vip-cidr {{ vip_cidr }}
    --ca {{ cca_cert_dir }}/ca.pem
    --ca-key {{ cca_cert_dir }}/ca-key.pem
    -o /tmp/cca-init
  args:
    creates: /tmp/cca-init/setup.sh
  when: inventory_hostname != groups['controlplane'][0]

- name: Run setup script on secondary nodes
  command: /tmp/cca-init/setup.sh
  args:
    creates: /etc/ccattler/pki/node.pem
  when: inventory_hostname != groups['controlplane'][0]

- name: Write etcd endpoints config (all 3 nodes)
  copy:
    dest: /etc/ccattler/endpoints
    content: "{{ etcd_endpoints }}\n"
    mode: "0600"

- name: Install cca-server systemd unit (HA mode with --node-id)
  template:
    src: cca-server.service.j2
    dest: /etc/systemd/system/cca-server.service
    mode: "0644"
  notify: restart cca-server

- name: Enable and start cca-server
  systemd:
    name: cca-server
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for cca-server API to respond
  wait_for:
    host: "{{ ansible_host }}"
    port: 9770
    timeout: 45

- name: Copy example configs from local checkout
  copy:
    src: "{{ playbook_dir }}/../../examples/"
    dest: /var/lib/ccattler/examples/
    mode: "0644"
    directory_mode: "0755"
  when: inventory_hostname == groups['controlplane'][0]
