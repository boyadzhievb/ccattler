---
# cca init generates PKI and a setup script that installs certificates,
# configures etcd TLS via systemd drop-in, and creates systemd units.

- name: Generate PKI and setup script with cca init
  command: >
    /usr/local/bin/cca init
    --advertise-address {{ ansible_host }}
    --node-id {{ inventory_hostname }}
    --cluster-cidr {{ cluster_cidr }}
    --vip-cidr {{ vip_cidr }}
    -o /tmp/cca-init
  args:
    creates: /tmp/cca-init/setup.sh

- name: Run setup script
  command: /tmp/cca-init/setup.sh
  args:
    creates: /etc/ccattler/pki/ca.pem

# setup.sh copies the keys into place; the copies cca init left would outlive
# a root key rotation (M178 review). setup.sh stays as the creates: guard.
- name: Shred the private keys cca init left in /tmp/cca-init
  shell: |
    for key_file in /tmp/cca-init/*.key /tmp/cca-init/*-key.pem; do
      [ -e "$key_file" ] && shred -u "$key_file"
    done
    true
  args:
    executable: /bin/bash
  changed_when: false

# Clusters set up before M177 have no root key; cca server refuses to start
# without it (Flow 29). Generated once, never overwritten.
- name: Generate secret root key (clusters that predate M177)
  command: /usr/local/bin/cca secret generate-root-key
  args:
    creates: /etc/ccattler/secret-root.key
  register: secret_root_key_generation
  # A binary older than M177 has no such subcommand (it prints the secret
  # usage) and needs no root key; any other failure stops the play.
  failed_when: >-
    secret_root_key_generation.rc != 0 and
    'usage: cca secret' not in secret_root_key_generation.stderr

# Only after 'cca secret retire-legacy-key' succeeded (Flow 29 step 7): run the
# playbook with -e retire_legacy_secret_key=true. Earlier, the server still
# needs the key to open v1 envelopes.
- name: Remove the retired legacy secret master key from the control plane
  file:
    path: /etc/ccattler/secret-master.key
    state: absent
  when: retire_legacy_secret_key | default(false) | bool

- name: Assert the retired legacy secret master key is gone
  stat:
    path: /etc/ccattler/secret-master.key
  register: control_plane_legacy_key_file
  failed_when: control_plane_legacy_key_file.stat.exists
  when: retire_legacy_secret_key | default(false) | bool

- name: Enable and start cca-server
  systemd:
    name: cca-server
    enabled: true
    state: started
    daemon_reload: true

- name: Copy example configs from local checkout
  copy:
    src: "{{ playbook_dir }}/../../examples/"
    dest: /var/lib/ccattler/examples/
    mode: "0644"
    directory_mode: "0755"

- name: Wait for cca server API to respond
  wait_for:
    host: "{{ ansible_host }}"
    port: 9770
    timeout: 45
