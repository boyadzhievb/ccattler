---
# cca init generates PKI and a setup script that installs certificates,
# configures etcd TLS via systemd drop-in, and creates systemd units.

- name: Generate PKI and setup script with cca init
  command: >
    /usr/local/bin/cca init
    --advertise-address {{ ansible_host }}
    --node-id {{ inventory_hostname }}
    --cluster-cidr {{ cluster_cidr }}
    --vip-cidr {{ vip_cidr }}
    -o /tmp/cca-init
  args:
    creates: /tmp/cca-init/setup.sh

- name: Run setup script
  command: /tmp/cca-init/setup.sh
  args:
    creates: /etc/ccattler/pki/ca.pem

- name: Enable and start cca-server
  systemd:
    name: cca-server
    enabled: true
    state: started
    daemon_reload: true

- name: Create examples directory
  file:
    path: /var/lib/ccattler/examples
    state: directory
    mode: "0755"

- name: List example files from GitHub
  uri:
    url: "https://api.github.com/repos/boyadzhievb/ccattler/contents/examples"
    return_content: true
    headers:
      Accept: "application/vnd.github.v3+json"
  register: examples_listing

- name: Download example files
  get_url:
    url: "{{ item.download_url }}"
    dest: "/var/lib/ccattler/examples/{{ item.name }}"
    mode: "0644"
  loop: "{{ examples_listing.json | selectattr('name', 'match', '.*\\.ccattler$') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for cca server API to respond
  wait_for:
    host: "{{ ansible_host }}"
    port: 9770
    timeout: 45
