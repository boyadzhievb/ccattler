---
# Install Cilium agent in kvstore (etcd) mode on each node.
# Cilium reads CCattler's etcd directly — no Kubernetes CRDs needed.
# The CCattler agent writes service/endpoint/identity facts to etcd;
# Cilium's eBPF programs enforce them on the data plane.

- name: Install Cilium dependencies
  apt:
    name:
      - clang
      - llvm
      - ipset
    state: present

- name: Load ipset kernel modules
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - ip_set
    - ip_set_hash_ip

- name: Check if cilium-agent is already installed
  stat:
    path: /usr/local/bin/cilium-agent
  register: cilium_agent_binary

- name: Pull Cilium container image for binary extraction
  command: nerdctl pull quay.io/cilium/cilium:v{{ cilium_version }}
  when: not cilium_agent_binary.stat.exists

- name: Extract Cilium binaries and BPF templates from container image
  shell: |
    CONTAINER_ID=$(nerdctl create quay.io/cilium/cilium:v{{ cilium_version }} /bin/true)
    nerdctl cp "$CONTAINER_ID:/usr/bin/cilium-agent" /usr/local/bin/cilium-agent
    nerdctl cp "$CONTAINER_ID:/usr/bin/cilium" /usr/local/bin/cilium
    nerdctl cp "$CONTAINER_ID:/usr/bin/cilium-health-responder" /usr/local/bin/cilium-health-responder
    mkdir -p /var/lib/cilium
    nerdctl cp "$CONTAINER_ID:/var/lib/cilium/bpf" /var/lib/cilium/bpf
    nerdctl rm "$CONTAINER_ID"
    chmod 0755 /usr/local/bin/cilium-agent /usr/local/bin/cilium /usr/local/bin/cilium-health-responder
  when: not cilium_agent_binary.stat.exists

- name: Install Cilium eBPF filesystem mount
  shell: |
    if ! mount | grep -q "bpf on /sys/fs/bpf"; then
      mount bpffs /sys/fs/bpf -t bpf
    fi
  changed_when: false

- name: Ensure BPF filesystem is mounted at boot
  lineinfile:
    path: /etc/fstab
    line: "bpffs /sys/fs/bpf bpf defaults 0 0"
    state: present

- name: Create Cilium directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/cilium
    - /var/run/cilium
    - /var/lib/cilium

- name: Copy etcd TLS certs for Cilium
  copy:
    src: "{{ cca_cert_dir }}/{{ item.src }}"
    dest: "/etc/cilium/{{ item.dest }}"
    remote_src: true
    mode: "0600"
  loop:
    - { src: ca.pem, dest: etcd-ca.pem }
    - { src: node.pem, dest: etcd-cert.pem }
    - { src: node-key.pem, dest: etcd-key.pem }

- name: Write Cilium etcd config
  template:
    src: cilium-etcd.yaml.j2
    dest: /etc/cilium/etcd-config.yaml
    mode: "0600"

- name: Install Cilium agent systemd unit
  template:
    src: cilium-agent.service.j2
    dest: /etc/systemd/system/cilium-agent.service
  notify: restart cilium-agent

- name: Enable and start Cilium agent
  systemd:
    name: cilium-agent
    enabled: true
    state: restarted
    daemon_reload: true

- name: Wait for Cilium agent to become ready
  shell: cilium status --brief 2>&1 | grep -q "OK"
  retries: 20
  delay: 5
  register: cilium_ready
  until: cilium_ready.rc == 0
  changed_when: false
  failed_when: false

- name: Display Cilium status
  command: cilium status
  changed_when: false
  register: cilium_status

- name: Show Cilium status
  debug:
    msg: "{{ cilium_status.stdout_lines }}"
