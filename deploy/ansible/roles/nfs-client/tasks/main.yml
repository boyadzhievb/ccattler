---
- name: Install NFS client
  apt:
    name: nfs-common
    state: present
    update_cache: true

- name: Create NFS mount point
  file:
    path: "{{ nfs_mount_path }}"
    state: directory
    mode: "0750"

- name: Mount NFS share
  mount:
    path: "{{ nfs_mount_path }}"
    src: "{{ nfs_server }}:{{ nfs_export_path }}"
    fstype: nfs
    opts: defaults
    state: mounted

- name: Verify NFS mount is accessible
  command: ls "{{ nfs_mount_path }}"
  changed_when: false
