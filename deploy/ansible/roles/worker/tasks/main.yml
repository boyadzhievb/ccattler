---
- name: Configure containerd
  block:
    - name: Ensure containerd config directory exists
      file:
        path: /etc/containerd
        state: directory

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Enable and start containerd
      systemd:
        name: containerd
        enabled: true
        state: started

- name: Create join token for this worker
  command: >
    /usr/local/bin/cca token create
    --node-id {{ node_id | default(inventory_hostname) }}
    --ttl 15m
  delegate_to: "{{ groups['controlplane'][0] }}"
  register: join_token_output
  changed_when: true

- name: Extract token value from output
  set_fact:
    join_token_value: "{{ join_token_output.stdout_lines | select('match', '^Token:') | first | regex_replace('^Token:\\s+', '') }}"

- name: Join cluster via cca join
  command: >
    /usr/local/bin/cca join
    https://{{ hostvars[groups['controlplane'][0]].ansible_host }}:9770
    {{ join_token_value }}
    --node-id {{ node_id | default(inventory_hostname) }}
  args:
    creates: /etc/ccattler/secret-master.key

- name: Install cca-agent systemd unit
  template:
    src: cca-agent.service.j2
    dest: /etc/systemd/system/cca-agent.service
  notify: restart cca-agent

- name: Enable and start cca-agent
  systemd:
    name: cca-agent
    enabled: true
    state: started
    daemon_reload: true

- name: Clean stale BPF pins from previous agent run
  file:
    path: /sys/fs/bpf/cca
    state: absent
  when: dataplane_backend | default('auto') == 'ebpf'

- name: Wait for agent to register via API
  shell: >
    curl -sf
    --cacert {{ cca_cert_dir }}/ca.pem
    --cert {{ cca_cert_dir }}/node.pem
    --key {{ cca_cert_dir }}/node-key.pem
    -H "Accept: application/json"
    https://{{ hostvars[groups['controlplane'][0]].ansible_host }}:9770/status
    | grep -q '"id":"{{ node_id | default(inventory_hostname) }}"'
  delegate_to: "{{ groups['controlplane'][0] }}"
  register: node_registered
  retries: 10
  delay: 3
  until: node_registered.rc == 0
  changed_when: false

- name: Verify eBPF data plane initialized
  shell: >
    journalctl -u cca-agent --no-pager -o cat | grep -q 'initialization complete'
  register: ebpf_initialized
  retries: 5
  delay: 3
  until: ebpf_initialized.rc == 0
  changed_when: false
  when: dataplane_backend | default('auto') == 'ebpf'

- name: Verify BPF programs loaded
  shell: >
    bpftool prog list 2>/dev/null | grep -q 'cca_'
  register: bpf_programs_loaded
  changed_when: false
  failed_when: false
  when: dataplane_backend | default('auto') == 'ebpf'

- name: Report BPF health
  debug:
    msg: "eBPF data plane: {{ 'healthy' if bpf_programs_loaded.rc == 0 else 'FAILED — check: journalctl -u cca-agent' }}"
  when: dataplane_backend | default('auto') == 'ebpf'
