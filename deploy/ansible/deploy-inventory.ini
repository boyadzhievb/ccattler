# Long-lived deploy cluster on testbed-100.43 (libvirt VMs, 192.168.124.x)
#   cca-deploy-ctrl     (124.10): etcd + control plane + worker
#   cca-deploy-worker-1 (124.20): worker
#   cca-deploy-worker-2 (124.30): worker

[etcd]
cca-deploy-ctrl ansible_host=192.168.124.10 ansible_ssh_private_key_file=../../test/e2e/vm-deploy/.vmherd/id_ed25519

[controlplane]
cca-deploy-ctrl

[workers]
cca-deploy-ctrl
cca-deploy-worker-1 ansible_host=192.168.124.20 ansible_ssh_private_key_file=../../test/e2e/vm-deploy/.vmherd/id_ed25519
cca-deploy-worker-2 ansible_host=192.168.124.30 ansible_ssh_private_key_file=../../test/e2e/vm-deploy/.vmherd/id_ed25519

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=vmherd
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
etcd_endpoints=https://192.168.124.10:2379
dataplane_backend=ebpf
