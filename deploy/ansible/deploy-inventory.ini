# Long-lived deploy cluster on testbed-100.43 (libvirt VMs, 192.168.124.x)
#   cca-deploy-ctrl     (124.10): etcd + control plane + worker
#   cca-deploy-worker-1 (124.20): worker
#   cca-deploy-worker-2 (124.30): worker
#
# SSH key path is resolved at runtime by cluster_test.sh via 'vmherd info ssh-key'
# and passed as --extra-vars vmherd_ssh_key=<path>.

[etcd]
cca-deploy-ctrl ansible_host=192.168.124.10

[controlplane]
cca-deploy-ctrl

[workers]
cca-deploy-ctrl
cca-deploy-worker-1 ansible_host=192.168.124.20
cca-deploy-worker-2 ansible_host=192.168.124.30

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=vmherd
ansible_ssh_private_key_file={{ vmherd_ssh_key }}
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
etcd_endpoints=https://192.168.124.10:2379
dataplane_backend=ebpf
nfs_server=192.168.124.1
nfs_export_path=/mnt/disk2/exports/cca-volumes
nfs_mount_path=/mnt/nfs/cca-volumes
storage_backend=nfs
storage_directory=/mnt/nfs/cca-volumes
