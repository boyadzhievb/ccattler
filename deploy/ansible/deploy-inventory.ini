# Long-lived deploy cluster on libvirt VMs (192.168.124.x)
#   cca-deploy-ctrl       (124.10): etcd + control plane + worker
#   cca-deploy-worker-1   (124.20): worker only
#   cca-deploy-worker-2   (124.30): worker only

[etcd]
cca-deploy-ctrl ansible_host=192.168.124.10 ansible_ssh_private_key_file=.vagrant/machines/cca-deploy-ctrl/libvirt/private_key

[controlplane]
cca-deploy-ctrl

[workers]
cca-deploy-ctrl node_id=deploy-node-1
cca-deploy-worker-1 ansible_host=192.168.124.20 node_id=deploy-node-2 ansible_ssh_private_key_file=.vagrant/machines/cca-deploy-worker-1/libvirt/private_key
cca-deploy-worker-2 ansible_host=192.168.124.30 node_id=deploy-node-3 ansible_ssh_private_key_file=.vagrant/machines/cca-deploy-worker-2/libvirt/private_key

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=vagrant
ansible_ssh_common_args=-o StrictHostKeyChecking=no
etcd_endpoints=http://192.168.124.10:2379
