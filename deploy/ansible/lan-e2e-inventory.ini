# Bridged-LAN E2E cluster (non-HA) on testbed-100.77: vmherd VMs attached to
# host bridge br1 (test/e2e/vm-lan/Herdfile), same layout as the bare-metal
# E2E cluster — the control-plane node runs no agent.
#   cca-lan-ctrl     (100.50): etcd + control plane
#   cca-lan-worker-1 (100.51): worker
#   cca-lan-worker-2 (100.52): worker
#
# SSH key path is resolved at runtime by cluster_test.sh via 'vmherd info ssh-key'
# and passed as --extra-vars vmherd_ssh_key=<path>.

[etcd]
cca-lan-ctrl ansible_host=192.168.100.50

[controlplane]
cca-lan-ctrl

[workers]
cca-lan-worker-1 ansible_host=192.168.100.51
cca-lan-worker-2 ansible_host=192.168.100.52

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=vmherd
ansible_ssh_private_key_file={{ vmherd_ssh_key }}
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
etcd_endpoints=https://192.168.100.50:2379
