# HA control-plane cluster on vmherd VMs (3 ctrl + 1 worker)
#
# Subnet: 192.168.125.0/24 (separate from deploy cluster at 124.x)
# Total memory: 3x4GB + 1x2GB = 14GB
#
# Deploy:
#   cd test/e2e/vm-ha && vmherd up
#   VMHERD_KEY=$(cd test/e2e/vm-ha && vmherd info ssh-key)
#   ansible-playbook -i ha-vmherd-inventory.ini ha-deploy.yml \
#     --extra-vars vmherd_ssh_key=$VMHERD_KEY

[etcd]
cca-ha-ctrl-1 ansible_host=192.168.125.11
cca-ha-ctrl-2 ansible_host=192.168.125.12
cca-ha-ctrl-3 ansible_host=192.168.125.13

[controlplane]
cca-ha-ctrl-1
cca-ha-ctrl-2
cca-ha-ctrl-3

[workers]
cca-ha-worker-1 ansible_host=192.168.125.21

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=vmherd
ansible_ssh_private_key_file={{ vmherd_ssh_key }}
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
etcd_endpoints=https://192.168.125.11:2379,https://192.168.125.12:2379,https://192.168.125.13:2379
