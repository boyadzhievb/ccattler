---
# Ephemeral e2e test cluster: 2 VMs, deploy CCattler, deploy Java test app
#
# Uses test-Vagrantfile (192.168.122.x, 2 nodes) — separate from deploy-Vagrantfile.
#
# Run on 192.168.100.43:
#   cd /path/to/ccattler/deploy/ansible
#   ansible-playbook -i test-inventory.ini test-deploy.yml

- name: Create test VMs with vagrant
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [vagrant]
  tasks:
    - name: Start VMs (no provisioning)
      shell: VAGRANT_VAGRANTFILE=test-Vagrantfile vagrant up --no-provision
      args:
        chdir: "{{ playbook_dir }}"

    - name: Wait for VMs to accept SSH
      wait_for:
        host: "{{ item }}"
        port: 22
        timeout: 180
      loop:
        - 192.168.122.10
        - 192.168.122.20

- name: Clean up old state (skip with --skip-tags cleanup)
  hosts: all
  become: true
  tags: [cleanup]
  roles:
    - cleanup

- name: Common setup on all nodes
  hosts: all
  become: true
  roles:
    - common

- name: Install and start etcd
  hosts: etcd
  become: true
  roles:
    - etcd

- name: Generate CA and distribute certificates
  hosts: all
  become: true
  roles:
    - certificates

- name: Provision control-plane nodes
  hosts: controlplane
  become: true
  roles:
    - controlplane

- name: Provision worker nodes
  hosts: workers
  become: true
  roles:
    - worker

# Workload deployment is handled by cluster_test.sh after image pre-pull.
# Ansible only provisions infrastructure (etcd, certificates, server, agents).
