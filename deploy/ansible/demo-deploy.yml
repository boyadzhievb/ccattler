---
# Demo cluster: create VMs, deploy CCattler, deploy Airflow.
#
# Called by install.sh — not intended to be run directly.

- name: Create demo VMs with Vagrant
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [vagrant]
  tasks:
    - name: Destroy existing VMs (idempotent)
      shell: vagrant destroy -f
      args:
        chdir: "{{ playbook_dir }}"
      environment:
        VAGRANT_VAGRANTFILE: "{{ playbook_dir }}/demo-Vagrantfile"
      ignore_errors: true

    - name: Start VMs (no provisioning)
      shell: vagrant up --no-provision
      args:
        chdir: "{{ playbook_dir }}"
      environment:
        VAGRANT_VAGRANTFILE: "{{ playbook_dir }}/demo-Vagrantfile"

    - name: Wait for VMs to accept SSH
      wait_for:
        host: "{{ item }}"
        port: 22
        timeout: 180
      loop:
        - 192.168.56.10
        - 192.168.56.20

- name: Clean up old state (skip with --skip-tags cleanup)
  hosts: all
  become: true
  tags: [cleanup]
  roles:
    - cleanup

- name: Common setup on all nodes
  hosts: all
  become: true
  roles:
    - common

- name: Provision control-plane node
  hosts: controlplane
  become: true
  roles:
    - controlplane

- name: Provision worker nodes
  hosts: workers
  become: true
  roles:
    - worker

- name: Deploy Airflow application
  hosts: controlplane
  become: true
  tags: [testapp]
  tasks:
    - name: Wait for CCattler server to be ready
      wait_for:
        port: 9770
        host: "{{ ansible_host }}"
        timeout: 30

    - name: Create Airflow secrets
      command: /usr/local/bin/cca secret set {{ item.name }} {{ item.value }}
      loop:
        - { name: "airflow.db-password", value: "airflow" }
        - { name: "airflow.admin-password", value: "airflow" }
        - { name: "airflow.webserver-secret-key", value: "{{ lookup('password', '/dev/null length=32 chars=hexdigits') }}" }
        - { name: "airflow.fernet-key", value: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') | b64encode }}" }
      changed_when: true

    - name: Copy Airflow deployment config to control plane
      copy:
        src: "{{ playbook_dir }}/../../test/e2e/workloads/airflow.cca"
        dest: /tmp/airflow.cca
        mode: "0644"

    - name: Apply Airflow deployment
      command: >
        /usr/local/bin/cca apply /tmp/airflow.cca
        --set registry={{ insecure_registry | default('docker.io') }}

    - name: Wait for Airflow containers to start
      pause:
        seconds: 60

    - name: Verify Airflow instances are running
      command: >
        curl -sf
        --cacert {{ cca_cert_dir }}/ca.pem
        --cert {{ cca_cert_dir }}/node.pem
        --key {{ cca_cert_dir }}/node-key.pem
        -H "Accept: application/json"
        https://{{ ansible_host }}:9770/status
      register: cluster_status

    - name: Show running instances
      debug:
        msg: "{{ (cluster_status.stdout | from_json).instances | map(attribute='id') | list }}"

    - name: Print demo summary
      debug:
        msg: |
          ============================================
          CCattler demo cluster is running!

          Control plane: {{ ansible_host }}:9770
          Airflow UI:    http://{{ ansible_host }}:8080
                         (user: airflow / airflow)

          Services:
            metadata-db  1 x postgres:16
            redis        1 x redis:7
            webserver    1 x apache/airflow:2.10.5 (:8080)
            scheduler    1 x apache/airflow:2.10.5
            worker       2 x apache/airflow:2.10.5

          Commands:
            install.sh demo ssh ctrl     — SSH into control plane
            install.sh demo ssh worker   — SSH into worker
            install.sh demo status       — Show VM status
            install.sh demo destroy      — Tear down
          ============================================
