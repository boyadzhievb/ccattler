---
# Demo cluster: create VMs, deploy CCattler, deploy Airflow.
#
# Called by install.sh — not intended to be run directly.

- name: Create demo VMs with Vagrant
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [vagrant]
  tasks:
    - name: Destroy existing VMs (idempotent)
      shell: vagrant destroy -f
      args:
        chdir: "{{ playbook_dir }}"
      environment:
        VAGRANT_VAGRANTFILE: "{{ playbook_dir }}/demo-Vagrantfile"
      ignore_errors: true

    - name: Start VMs (no provisioning)
      shell: vagrant up --no-provision
      args:
        chdir: "{{ playbook_dir }}"
      environment:
        VAGRANT_VAGRANTFILE: "{{ playbook_dir }}/demo-Vagrantfile"

    - name: Wait for VMs to accept SSH
      wait_for:
        host: "{{ item }}"
        port: 22
        timeout: 180
      loop:
        - 192.168.56.10
        - 192.168.56.20

- name: Clean up old state (skip with --skip-tags cleanup)
  hosts: all
  become: true
  tags: [cleanup]
  roles:
    - cleanup

- name: Common setup on all nodes
  hosts: all
  become: true
  roles:
    - common

- name: Generate CA and distribute certificates
  hosts: all
  become: true
  roles:
    - certificates

- name: Install and start etcd
  hosts: etcd
  become: true
  roles:
    - etcd

- name: Provision control-plane nodes
  hosts: controlplane
  become: true
  roles:
    - controlplane

- name: Provision worker nodes
  hosts: workers
  become: true
  roles:
    - worker

- name: Generate Airflow self-signed TLS certificate
  hosts: controlplane
  become: true
  tags: [testapp]
  tasks:
    - name: Create Airflow cert directory
      file:
        path: /tmp/airflow-certs
        state: directory
        mode: "0755"

    - name: Generate self-signed certificate for Airflow webserver
      shell: >
        openssl req -x509 -newkey rsa:2048 -nodes
        -keyout /tmp/airflow-certs/tls.key
        -out /tmp/airflow-certs/tls.crt
        -days 365
        -subj "/CN=airflow.home.arpa/O=CCattler"
      args:
        creates: /tmp/airflow-certs/tls.crt

    - name: Generate Fernet key for Airflow
      shell: openssl rand -base64 32 > /tmp/airflow-certs/fernet-key
      args:
        creates: /tmp/airflow-certs/fernet-key

- name: Deploy Airflow application
  hosts: controlplane
  become: false
  tags: [testapp]
  tasks:
    - name: Copy Airflow deployment config to control plane
      become: true
      copy:
        src: "{{ playbook_dir }}/airflow-test-app.cca"
        dest: /tmp/airflow-test-app.cca
        mode: "0644"

    - name: Wait for CCattler server to be ready
      wait_for:
        port: 9770
        host: "{{ ansible_host }}"
        timeout: 30

    - name: Apply Airflow deployment
      command: /usr/local/bin/cca apply /tmp/airflow-test-app.cca

    - name: Wait for Airflow containers to start
      pause:
        seconds: 45

    - name: Verify Airflow instances are running
      command: >
        curl -sf
        --cacert {{ cca_cert_dir }}/ca.pem
        --cert {{ cca_cert_dir }}/node.pem
        --key {{ cca_cert_dir }}/node-key.pem
        -H "Accept: application/json"
        https://{{ ansible_host }}:9770/status
      register: cluster_status

    - name: Show running instances
      debug:
        msg: "{{ (cluster_status.stdout | from_json).instances | map(attribute='id') | list }}"

    - name: Print demo summary
      debug:
        msg: |
          ============================================
          CCattler demo cluster is running!

          Control plane: 192.168.56.10:9770
          Airflow UI:    https://192.168.56.20:443
                         (self-signed cert, user: airflow / airflow)

          Services:
            metadata-db  1 x postgres:16
            redis        1 x redis:7
            webserver    1 x apache/airflow:2.10.5 (HTTPS :443)
            scheduler    1 x apache/airflow:2.10.5
            worker       2 x apache/airflow:2.10.5

          Commands:
            install.sh demo ssh ctrl     — SSH into control plane
            install.sh demo ssh worker   — SSH into worker
            install.sh demo status       — Show VM status
            install.sh demo destroy      — Tear down
          ============================================
