# Bridged-LAN HA cluster on testbed-100.77: vmherd VMs on host bridge br1
# (test/e2e/vm-ha-lan/Herdfile).
#   cca-ha-lan-ctrl-1..3 (100.53-.55): etcd (3-member raft) + cca-server
#   cca-ha-lan-worker-1  (100.56):     worker
#
# Run from testbed-100.77 with the vmherd SSH key:
#   ansible-playbook -i lan-ha-inventory.ini ha-deploy.yml \
#     -e vmherd_ssh_key=$(cd ../../test/e2e/vm-ha-lan && vmherd info ssh-key)

[etcd]
cca-ha-lan-ctrl-1 ansible_host=192.168.100.53
cca-ha-lan-ctrl-2 ansible_host=192.168.100.54
cca-ha-lan-ctrl-3 ansible_host=192.168.100.55

[controlplane]
cca-ha-lan-ctrl-1
cca-ha-lan-ctrl-2
cca-ha-lan-ctrl-3

[workers]
cca-ha-lan-worker-1 ansible_host=192.168.100.56

[ccattler:children]
controlplane
workers

[all:vars]
ansible_user=vmherd
ansible_ssh_private_key_file={{ vmherd_ssh_key }}
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
etcd_endpoints=https://192.168.100.53:2379,https://192.168.100.54:2379,https://192.168.100.55:2379
