---
# Bare-metal 3-node cluster deployment (no VMs, no Vagrant)
#
# Prerequisites:
#   - 3 Debian/Ubuntu servers with SSH access
#   - Fill in IPs in baremetal-inventory.ini
#   - Go toolchain on the control machine (cross-compiles the cca binary)
#
# Run from your workstation:
#   cd deploy/ansible
#   ansible-playbook -i baremetal-inventory.ini baremetal-deploy.yml
#
# Update binary only (skip cleanup and workload deploy):
#   ansible-playbook -i baremetal-inventory.ini baremetal-deploy.yml --skip-tags cleanup,testapp,cilium
#
# Deploy demo workload after cluster is up:
#   ansible-playbook -i baremetal-inventory.ini baremetal-deploy.yml --tags testapp
#
# BPF data plane: set dataplane_backend=ebpf in inventory. The playbook
# installs clang on nodes and compiles BPF ELFs from source on each node
# (Linux kernel headers required, cannot cross-compile from macOS).

- name: Clean up old state (skip with --skip-tags cleanup)
  hosts: all
  become: true
  tags: [cleanup]
  roles:
    - cleanup

- name: Common setup on all nodes
  hosts: all
  become: true
  roles:
    - common

- name: Provision control-plane node
  hosts: controlplane
  become: true
  roles:
    - controlplane

- name: Provision worker nodes
  hosts: workers
  become: true
  roles:
    - worker

- name: Install Cilium eBPF data plane
  hosts: ccattler
  become: true
  tags: [cilium]
  roles:
    - role: cilium
      when: dataplane_backend == "cilium"

- name: Deploy demo workload
  hosts: controlplane
  become: true
  tags: [testapp]
  tasks:
    - name: Copy demo workload config
      copy:
        src: "{{ playbook_dir }}/baremetal-demo.cca"
        dest: /tmp/baremetal-demo.cca
        mode: "0644"

    - name: Wait for CCattler server to be ready
      shell: >
        curl -sf --cacert {{ cca_cert_dir }}/ca.pem
        --cert {{ cca_cert_dir }}/node.pem --key {{ cca_cert_dir }}/node-key.pem
        https://{{ ansible_host }}:9770/healthz
      retries: 15
      delay: 2
      register: server_ready
      until: server_ready.rc == 0

    - name: Apply demo workload
      command: /usr/local/bin/cca apply /tmp/baremetal-demo.cca

    - name: Wait for workload to converge
      pause:
        seconds: 30

    - name: Show cluster status
      command: >
        curl -sf
        --cacert {{ cca_cert_dir }}/ca.pem
        --cert {{ cca_cert_dir }}/node.pem
        --key {{ cca_cert_dir }}/node-key.pem
        -H "Accept: application/json"
        https://{{ ansible_host }}:9770/status
      register: cluster_status

    - name: Display running instances
      debug:
        msg: "{{ (cluster_status.stdout | from_json).instances | map(attribute='id') | list }}"
