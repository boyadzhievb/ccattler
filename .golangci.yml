version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
    - gocritic
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G104
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocritic:
      enabled-checks:
        - dupImport
        - ifElseChain
        - nestingReduce
        - truncateCmp

  exclusions:
    rules:
      - linters:
          - errcheck
        path: _test\.go
      - linters:
          - gocritic
        text: exitAfterDefer
    paths:
      - vendor

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
