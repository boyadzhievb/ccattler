version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
    - gocritic
    - misspell

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      exclude:
        - G104
        - G304
    gocritic:
      enabled-checks:
        - dupImport
        - ifElseChain
        - nestingReduce
        - truncateCmp

  exclusions:
    paths:
      - vendor

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
