name: Deploy Testbed Cluster

on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Workloads to deploy (comma-separated or 'all')"
        required: false
        default: "airflow"
        type: choice
        options:
          - "airflow"
          - "airflow,zabbix"
          - "all"
          - "zabbix"
          - "whoami"
          - "airflow,whoami"
          - "zabbix,whoami"
      clear_first:
        description: "Clear existing workloads before deploying"
        required: false
        default: false
        type: boolean

concurrency:
  group: testbed-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clear existing workloads
        if: ${{ inputs.clear_first == true }}
        run: ./test/e2e/cluster_test.sh --env deploy --clear-workloads

      - name: Deploy cluster (3-node, no teardown, latest release binary)
        run: |
          WORKLOAD="${{ inputs.workload || 'airflow' }}"
          ./test/e2e/cluster_test.sh --env deploy --from-release --workload "$WORKLOAD"

      - name: Collect logs on failure
        if: failure()
        run: |
          ANSIBLE_DIR=deploy/ansible
          for vm in cca-deploy-ctrl cca-deploy-worker-1 cca-deploy-worker-2; do
            ip_var=""
            case "$vm" in
              cca-deploy-ctrl)     ip_var="192.168.124.10" ;;
              cca-deploy-worker-1) ip_var="192.168.124.20" ;;
              cca-deploy-worker-2) ip_var="192.168.124.30" ;;
            esac
            key="$ANSIBLE_DIR/.vagrant/machines/$vm/libvirt/private_key"
            if [ -f "$key" ]; then
              echo "=== $vm server.log ==="
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i "$key" "vagrant@$ip_var" \
                "sudo cat /var/log/ccattler/server.log 2>/dev/null || true" || true
              echo "=== $vm agent.log ==="
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i "$key" "vagrant@$ip_var" \
                "sudo cat /var/log/ccattler/agent.log 2>/dev/null || true" || true
            fi
          done
