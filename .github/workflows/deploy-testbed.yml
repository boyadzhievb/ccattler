name: Deploy Testbed Cluster

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Deploy cluster (no teardown, latest release binary)
        run: ./test/e2e/cluster_test.sh --from-release --no-destroy

      - name: Collect logs on failure
        if: failure()
        run: |
          ANSIBLE_DIR=deploy/ansible
          for vm in cca-test-ctrl cca-test-worker-1 cca-test-worker-2; do
            ip_var=""
            case "$vm" in
              cca-test-ctrl)     ip_var="192.168.122.10" ;;
              cca-test-worker-1) ip_var="192.168.122.20" ;;
              cca-test-worker-2) ip_var="192.168.122.30" ;;
            esac
            key="$ANSIBLE_DIR/.vagrant/machines/$vm/libvirt/private_key"
            if [ -f "$key" ]; then
              echo "=== $vm server.log ==="
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i "$key" "vagrant@$ip_var" \
                "sudo cat /var/log/ccattler/server.log 2>/dev/null || true" || true
              echo "=== $vm agent.log ==="
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i "$key" "vagrant@$ip_var" \
                "sudo cat /var/log/ccattler/agent.log 2>/dev/null || true" || true
            fi
          done
