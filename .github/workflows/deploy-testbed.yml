name: Deploy Testbed Cluster

on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Workloads to deploy (comma-separated or 'all')"
        required: false
        default: "airflow,whoami,whoami-multiport"
        type: choice
        options:
          - "airflow,whoami,whoami-multiport"
          - "airflow,whoami"
          - "airflow"
          - "all"
          - "whoami,whoami-multiport"
          - "zabbix"
          - "zabbix,whoami"
      clear_first:
        description: "Clear existing workloads before deploying"
        required: false
        default: false
        type: boolean

concurrency:
  group: testbed-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, deploy]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clear existing workloads
        if: ${{ inputs.clear_first == true }}
        run: ./test/e2e/cluster_test.sh --env deploy --clear-workloads

      - name: Build binary from source
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o deploy/ansible/cca-linux-amd64 ./cmd/cca/

      - name: Deploy cluster (3-node, no teardown, source-built binary)
        run: |
          WORKLOAD="${{ inputs.workload || 'airflow,whoami,whoami-multiport' }}"
          ./test/e2e/cluster_test.sh --env deploy --skip-build --workload "$WORKLOAD"

      - name: Collect logs on failure
        if: failure()
        run: |
          SSH_KEY="$HOME/.local/share/cca-vms-deploy/id_ed25519"
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          declare -A NODE_IPS=(["cca-deploy-ctrl"]="192.168.124.10" ["cca-deploy-worker-1"]="192.168.124.20" ["cca-deploy-worker-2"]="192.168.124.30")
          for vm in cca-deploy-ctrl cca-deploy-worker-1 cca-deploy-worker-2; do
            ip="${NODE_IPS[$vm]}"
            if [ -f "$SSH_KEY" ]; then
              echo "=== $vm cca-server journal ==="
              ssh $SSH_OPTS -i "$SSH_KEY" "cca@$ip" "sudo journalctl -u cca-server --no-pager -n 200 2>/dev/null || true" || true
              echo "=== $vm cca-agent journal ==="
              ssh $SSH_OPTS -i "$SSH_KEY" "cca@$ip" "sudo journalctl -u cca-agent --no-pager -n 200 2>/dev/null || true" || true
            fi
          done
