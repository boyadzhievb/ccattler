name: Deploy Testbed Cluster

on:
  workflow_dispatch:
    inputs:
      workload:
        description: "Workloads to deploy (comma-separated or 'all')"
        required: false
        default: "airflow,whoami,whoami-multiport"
        type: choice
        options:
          - "airflow,whoami,whoami-multiport"
          - "airflow,whoami"
          - "airflow"
          - "all"
          - "whoami,whoami-multiport"
          - "zabbix"
          - "zabbix,whoami"
      clear_first:
        description: "Clear existing workloads before deploying"
        required: false
        default: false
        type: boolean

concurrency:
  group: testbed-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Clear existing workloads
        if: ${{ inputs.clear_first == true }}
        run: ./test/e2e/cluster_test.sh --env deploy --clear-workloads

      - name: Build binary from source
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o deploy/ansible/cca-linux-amd64 ./cmd/cca/

      - name: Deploy cluster (3-node, no teardown, source-built binary)
        run: |
          WORKLOAD="${{ inputs.workload || 'airflow,whoami,whoami-multiport' }}"
          ./test/e2e/cluster_test.sh --env deploy --skip-build --workload "$WORKLOAD"

      - name: Collect logs on failure
        if: failure()
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          declare -A NODE_IPS=(["node-1"]="192.168.100.215" ["node-2"]="192.168.100.30" ["node-3"]="192.168.100.31")
          for node in node-1 node-2 node-3; do
            ip="${NODE_IPS[$node]}"
            echo "=== $node server.log ==="
            ssh $SSH_OPTS "bozhan@$ip" "sudo cat /var/log/ccattler/server.log 2>/dev/null || true" || true
            echo "=== $node agent.log ==="
            ssh $SSH_OPTS "bozhan@$ip" "sudo cat /var/log/ccattler/agent.log 2>/dev/null || true" || true
          done
