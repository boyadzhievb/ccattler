name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            label: macOS-amd64
          - goos: darwin
            goarch: arm64
            label: macOS-arm64
          - goos: linux
            goarch: amd64
            label: linux-amd64
          - goos: linux
            goarch: arm64
            label: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF#refs/tags/}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o cca ./cmd/cca/

      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./cca version

      - name: Package
        run: |
          version="${GITHUB_REF#refs/tags/}"
          archive="cca-${version}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar czf "${archive}" cca
          sha256sum "${archive}" > "${archive}.sha256"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cca-${{ matrix.label }}
          path: |
            cca-*.tar.gz
            cca-*.tar.gz.sha256

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true

      - name: Create checksums file
        run: cat *.sha256 > checksums.txt

      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          generate_release_notes: true
          files: |
            cca-*.tar.gz
            cca-*.tar.gz.sha256
            install.sh
            install-demo.sh
            checksums.txt
