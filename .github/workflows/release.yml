name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            label: macOS-amd64
          - goos: darwin
            goarch: arm64
            label: macOS-arm64
          - goos: linux
            goarch: amd64
            label: linux-amd64
          - goos: linux
            goarch: arm64
            label: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the BPF freshness check compares commit times of files.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build (slim)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF#refs/tags/}"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o cca ./cmd/cca/

      - name: Build (cloud-enabled)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF#refs/tags/}"
          go build -trimpath -tags cloudprovider -ldflags "-s -w -X main.version=${version}" -o cca-cloud ./cmd/cca/

      # The BPF object is committed (network/ebpf/cca_dataplane.o, built with
      # `make bpf`) and embedded as-is, as in every other build. The release no
      # longer recompiles it: that needed apt packages from Ubuntu's mirrors,
      # whose outages failed v1.93.0-beta three times. This step refuses a
      # release whose BPF sources changed after the committed object.
      - name: Check the committed BPF object is current
        if: matrix.goos == 'linux'
        run: |
          object_time=$(git log -1 --format=%ct -- network/ebpf/cca_dataplane.o)
          source_time=$(git log -1 --format=%ct -- network/ebpf/*.c network/ebpf/*.h)
          if [ "$source_time" -gt "$object_time" ]; then
            echo "::error::network/ebpf sources changed after cca_dataplane.o; run 'make bpf' and commit the object"
            exit 1
          fi

      - name: Build (ebpf)
        if: matrix.goos == 'linux'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF#refs/tags/}"
          go build -trimpath -tags ebpf -ldflags "-s -w -X main.version=${version}" -o cca-ebpf ./cmd/cca/

      - name: Build k8s-to-cca converter
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o k8s-to-cca ./cmd/k8s-to-cca/

      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./cca version
          ./cca-cloud version
          ./cca-ebpf version

      - name: Package
        run: |
          version="${GITHUB_REF#refs/tags/}"
          archive="cca-${version}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar czf "${archive}" cca k8s-to-cca
          sha256sum "${archive}" > "${archive}.sha256"
          cloud_archive="cca-cloud-${version}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar czf "${cloud_archive}" cca-cloud k8s-to-cca
          sha256sum "${cloud_archive}" > "${cloud_archive}.sha256"
          if [ -f cca-ebpf ]; then
            ebpf_archive="cca-ebpf-${version}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
            tar czf "${ebpf_archive}" cca-ebpf k8s-to-cca
            sha256sum "${ebpf_archive}" > "${ebpf_archive}.sha256"
          fi
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cca-${{ matrix.label }}
          path: |
            cca-*.tar.gz
            cca-cloud-*.tar.gz
            cca-ebpf-*.tar.gz
            *.sha256

  release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          merge-multiple: true

      - name: Create checksums file
        run: cat *.sha256 > checksums.txt

      - uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          generate_release_notes: true
          files: |
            cca-v*-*.tar.gz
            cca-cloud-v*-*.tar.gz
            cca-ebpf-v*-*.tar.gz
            *.sha256
            install.sh
            install-demo.sh
            checksums.txt
