name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            label: macOS-amd64
          - goos: darwin
            goarch: arm64
            label: macOS-arm64
          - goos: linux
            goarch: amd64
            label: linux-amd64
          - goos: linux
            goarch: arm64
            label: linux-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF#refs/tags/}"
          go build -ldflags "-s -w -X main.version=${version}" -o cca ./cmd/cca/

      - name: Package
        run: |
          version="${GITHUB_REF#refs/tags/}"
          archive="cca-${version}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar czf "${archive}" cca
          sha256sum "${archive}" > "${archive}.sha256"
          echo "ARCHIVE=${archive}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: cca-${{ matrix.label }}
          path: |
            cca-*.tar.gz
            cca-*.tar.gz.sha256

  package-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Package deploy directory
        run: |
          tar czf ccattler-deploy.tar.gz -C deploy ansible
          sha256sum ccattler-deploy.tar.gz > ccattler-deploy.tar.gz.sha256

      - uses: actions/upload-artifact@v5
        with:
          name: ccattler-deploy
          path: |
            ccattler-deploy.tar.gz
            ccattler-deploy.tar.gz.sha256

  release:
    needs: [build, package-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Create checksums file
        run: cat *.sha256 > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cca-*.tar.gz
            cca-*.tar.gz.sha256
            ccattler-deploy.tar.gz
            checksums.txt
