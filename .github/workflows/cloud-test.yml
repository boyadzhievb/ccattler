name: Cloud Provider Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  cloud-aws:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run AWS and simulator tests
        run: go test -race -count=1 -timeout=10m -run "TestAWS|TestSimulator|TestAzure" ./cloud/

  cloud-gcp:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/804511906677/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ccattler-ci@project-5caf392b-0c70-411a-b59.iam.gserviceaccount.com

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Run GCP tests
        run: go test -race -count=1 -timeout=5m -run "TestGCP" ./cloud/
