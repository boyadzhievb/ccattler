name: E2E Cluster Test

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      workload:
        description: "Workloads to deploy (comma-separated or 'all')"
        required: false
        default: "whoami"
        type: choice
        options:
          - "whoami"
          - "whoami,whoami-multiport"
          - "all"
      clear_first:
        description: "Clear existing workloads before deploying"
        required: false
        default: false
        type: boolean
      binary_source:
        description: "Binary source"
        required: false
        default: "build"
        type: choice
        options:
          - "build"
          - "release"

concurrency:
  group: baremetal-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [self-hosted, e2e]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Clear existing workloads
        if: ${{ inputs.clear_first == true }}
        run: ./test/e2e/cluster_test.sh --clear-workloads

      - name: Run e2e cluster test
        run: |
          WORKLOAD="${{ inputs.workload || 'whoami' }}"
          BINARY_FLAG=""
          if [[ "${{ inputs.binary_source }}" == "release" ]]; then
            BINARY_FLAG="--from-release"
          fi
          ./test/e2e/cluster_test.sh --workload "$WORKLOAD" $BINARY_FLAG

      - name: Collect logs on failure
        if: failure()
        run: |
          SSH_ARGS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR"
          for node in node-1 node-2 node-3; do
            case "$node" in
              node-1) ip="192.168.100.215" ;;
              node-2) ip="192.168.100.30" ;;
              node-3) ip="192.168.100.31" ;;
            esac
            echo "=== $node cca-server journal ==="
            ssh $SSH_ARGS "bozhan@$ip" \
              "sudo journalctl -u cca-server --no-pager -n 200 2>/dev/null || true" || true
            echo "=== $node cca-agent journal ==="
            ssh $SSH_ARGS "bozhan@$ip" \
              "sudo journalctl -u cca-agent --no-pager -n 200 2>/dev/null || true" || true
          done
