name: E2E Cluster Test

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      workload:
        description: "Workloads to deploy (comma-separated or 'all')"
        required: false
        default: "whoami"
        type: choice
        options:
          - "whoami"
          - "whoami,whoami-multiport"
          - "whoami,whoami-multiport,gate-tls"
          - "all"
      clear_first:
        description: "Clear existing workloads before deploying"
        required: false
        default: false
        type: boolean
      binary_source:
        description: "Binary source"
        required: false
        default: "build"
        type: choice
        options:
          - "build"
          - "release"
      dataplane:
        description: "Data plane backend"
        required: false
        default: "auto"
        type: choice
        options:
          - "auto"
          - "nftables"
          - "ebpf"

concurrency:
  group: baremetal-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: [self-hosted, e2e]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Clear existing workloads
        if: ${{ inputs.clear_first == true }}
        run: ./test/e2e/cluster_test.sh --env lan --clear-workloads

      - name: Run e2e cluster test
        run: |
          WORKLOAD="${{ inputs.workload || 'whoami' }}"
          DATAPLANE="${{ inputs.dataplane || 'auto' }}"
          BINARY_FLAG=""
          if [[ "${{ inputs.binary_source }}" == "release" ]]; then
            BINARY_FLAG="--from-release"
          fi
          # Bridged-LAN VMs on testbed-100.77 (test/e2e/vm-lan); on failure
          # cluster_test.sh collects server/agent journals and keeps the VMs.
          ./test/e2e/cluster_test.sh --env lan --workload "$WORKLOAD" \
            --dataplane "$DATAPLANE" $BINARY_FLAG
