name: E2E Cluster Test

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      workload:
        description: "Workloads to deploy (comma-separated or 'all')"
        required: false
        default: "airflow,whoami,whoami-multiport"
        type: choice
        options:
          - "airflow,whoami,whoami-multiport"
          - "airflow,whoami"
          - "airflow"
          - "all"
          - "whoami,whoami-multiport"
          - "zabbix"
          - "zabbix,whoami"
      clear_first:
        description: "Clear existing workloads before deploying"
        required: false
        default: false
        type: boolean
      binary_source:
        description: "Binary source"
        required: false
        default: "build"
        type: choice
        options:
          - "build"
          - "release"

concurrency:
  group: testbed-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Clear existing workloads
        if: ${{ inputs.clear_first == true }}
        run: ./test/e2e/cluster_test.sh --clear-workloads

      - name: Run e2e cluster test
        run: |
          WORKLOAD="${{ inputs.workload || 'airflow,whoami,whoami-multiport' }}"
          BINARY_FLAG=""
          if [[ "${{ inputs.binary_source }}" == "release" ]]; then
            BINARY_FLAG="--from-release"
          fi
          ./test/e2e/cluster_test.sh --workload "$WORKLOAD" $BINARY_FLAG

      - name: Collect logs on failure
        if: failure()
        run: |
          ANSIBLE_DIR=deploy/ansible
          for vm in cca-test-ctrl cca-test-worker-1; do
            ip_var=""
            case "$vm" in
              cca-test-ctrl)     ip_var="192.168.122.10" ;;
              cca-test-worker-1) ip_var="192.168.122.20" ;;
            esac
            key="$ANSIBLE_DIR/.vagrant/machines/$vm/libvirt/private_key"
            if [ -f "$key" ]; then
              echo "=== $vm server.log ==="
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i "$key" "vagrant@$ip_var" \
                "sudo cat /var/log/ccattler/server.log 2>/dev/null || true" || true
              echo "=== $vm agent.log ==="
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i "$key" "vagrant@$ip_var" \
                "sudo cat /var/log/ccattler/agent.log 2>/dev/null || true" || true
            fi
          done
