name: E2E Cluster Test

on:
  workflow_dispatch:

concurrency:
  group: testbed-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Run e2e cluster test (2-node)
        run: ./test/e2e/cluster_test.sh

      - name: Collect logs on failure
        if: failure()
        run: |
          ANSIBLE_DIR=deploy/ansible
          for vm in cca-test-ctrl cca-test-worker-1; do
            ip_var=""
            case "$vm" in
              cca-test-ctrl)     ip_var="192.168.122.10" ;;
              cca-test-worker-1) ip_var="192.168.122.20" ;;
            esac
            key="$ANSIBLE_DIR/.vagrant/machines/$vm/libvirt/private_key"
            if [ -f "$key" ]; then
              echo "=== $vm server.log ==="
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i "$key" "vagrant@$ip_var" \
                "sudo cat /var/log/ccattler/server.log 2>/dev/null || true" || true
              echo "=== $vm agent.log ==="
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -i "$key" "vagrant@$ip_var" \
                "sudo cat /var/log/ccattler/agent.log 2>/dev/null || true" || true
            fi
          done

      - name: Destroy VMs
        if: always()
        run: |
          cd deploy/ansible
          VAGRANT_VAGRANTFILE=test-Vagrantfile vagrant destroy -f 2>/dev/null || true
