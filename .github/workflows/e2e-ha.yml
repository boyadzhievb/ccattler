name: E2E HA Cluster Test

# HA checks on the vm-ha-lan set (3 control planes + 1 worker, bridged
# 192.168.100.53–.56) on testbed-100.77, runner labels e2e + ha. The set was
# created from HA_VMHERD_DIR; vmherd keeps state per directory, so every
# vmherd call uses that directory, never the runner checkout. The host has
# 16 GB and never runs this set next to the e2e set (vm-lan).
on:
  workflow_dispatch:
    inputs:
      skip_failover:
        description: "Skip destructive failover tests"
        required: false
        default: false
        type: boolean
      skip_deploy:
        description: "Skip Ansible deploy (cluster already running this commit)"
        required: false
        default: false
        type: boolean

concurrency:
  group: baremetal-e2e
  cancel-in-progress: false

env:
  ANSIBLE_DIR: deploy/ansible
  HA_VM_SET: lan
  HA_VMHERD_DIR: /mnt/disk2/home/bojan/ccattler/test/e2e/vm-ha-lan

jobs:
  ha-e2e:
    runs-on: [self-hosted, e2e, ha]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Refuse to run next to the e2e VM set
        run: |
          if virsh -c qemu:///system list --name | grep -q -- '-cca-lan-'; then
            echo "::error::the e2e set (vm-lan) is running; stop it first (16 GB host)"
            exit 1
          fi

      - name: Ensure the HA VM set is up
        run: cd "$HA_VMHERD_DIR" && vmherd up

      - name: Build cca binary
        if: ${{ inputs.skip_deploy != true }}
        run: GOOS=linux GOARCH=amd64 go build -o "$ANSIBLE_DIR/cca-linux-amd64" ./cmd/cca/

      - name: Deploy HA cluster
        if: ${{ inputs.skip_deploy != true }}
        run: |
          vmherd_ssh_key=$(cd "$HA_VMHERD_DIR" && vmherd info ssh-key)
          cd "$ANSIBLE_DIR"
          ansible-playbook -i lan-ha-inventory.ini ha-deploy.yml -v -e "vmherd_ssh_key=$vmherd_ssh_key"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"

      - name: Run HA tests
        run: |
          failover_flag=""
          if [[ "${{ inputs.skip_failover }}" == "true" ]]; then
            failover_flag="--skip-failover"
          fi
          ./test/e2e/vm-ha/ha_test.sh $failover_flag

      - name: Collect logs on failure
        if: failure()
        run: |
          cd "$HA_VMHERD_DIR"
          for vm_name in cca-ha-lan-ctrl-1 cca-ha-lan-ctrl-2 cca-ha-lan-ctrl-3 cca-ha-lan-worker-1; do
            echo "=== $vm_name ==="
            vmherd ssh "$vm_name" -- "systemctl list-units 'cca-*' 'etcd*' --no-pager; \
              sudo journalctl -u cca-server --no-pager -n 200; \
              sudo journalctl -u cca-agent --no-pager -n 200; \
              sudo journalctl -u etcd --no-pager -n 100" || true
          done
